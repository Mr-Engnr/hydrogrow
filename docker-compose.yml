services:
  backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8080:8080"
      # Dashboard's dev build calls http://localhost:5000/api directly
      # (hardcoded in src/services/*.js, not env-driven) instead of the
      # PORT the backend actually listens on. Mapping the same container
      # port to both host ports lets both the README's :8080 and the
      # dashboard's hardcoded :5000 reach the same backend, without
      # touching backend/dashboard source.
      - "5000:8080"
    volumes:
      - ./backend:/app
      - /app/node_modules

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      - backend
