# HydroGrow expo broker. LAN only. Installed to /etc/mosquitto/conf.d/hydrogrow.conf
# by deploy/install.sh (the stock /etc/mosquitto/mosquitto.conf includes conf.d/*).
#
# Security model: the Pi is on an isolated hotspot / travel router with no
# internet exposure, so anonymous access is allowed on purpose. To lock it down,
# set allow_anonymous false and point password_file at a file created with
#   mosquitto_passwd -c /etc/mosquitto/passwd hydrogrow
# then set MQTT_USER / MQTT_PASS in .env for the publisher, ingest and dashboard.

# --- Plain MQTT for the Pi publisher, ingest, fake_pi.py and replay.py ---
listener 1883 0.0.0.0
protocol mqtt

# --- WebSockets for browser clients (dashboard Live badge, optional) ---
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true
# password_file /etc/mosquitto/passwd

# --- Durability: QoS 1 messages for ingest (clean_session=false, fixed client
# id) are queued on disk if ingest is down, and survive a broker restart.
# "persistence true" + "persistence_location /var/lib/mosquitto/" come from the
# stock /etc/mosquitto/mosquitto.conf; repeating them here is a duplicate. ---
autosave_interval 30
max_queued_messages 10000
max_inflight_messages 20
queue_qos0_messages false

# --- Limits sized for a 4 GB Pi; telemetry messages are ~1.5 KB ---
message_size_limit 262144
max_connections 100

# --- Logging: destination is the stock "log_dest file /var/log/mosquitto/mosquitto.log"
# (sudo tail -f /var/log/mosquitto/mosquitto.log); only the verbosity is set here. ---
log_type error
log_type warning
log_type notice
connection_messages true
