# deploy/requirements-pi.lock
# Reconstructed 2026-11-06 from the backup of the working Pi (~/iot-env on the old card,
# Python 3.13.5, aarch64). Every pin below is the exact version that was installed in that
# venv (site-packages/*.dist-info). Install into a venv created with --system-site-packages:
#   python3 -m venv --system-site-packages ~/iot-env
#   ~/iot-env/bin/pip install -r deploy/requirements-pi.lock
#
# Resolved cross-platform on 2026-11-06 with: uv pip compile deploy/requirements-pi.lock --python-version 3.13
#   --python-platform aarch64-unknown-linux-gnu  (no conflicts; see deploy/requirements-pi.resolved.txt)
# NOT listed on purpose (come from apt, reachable through --system-site-packages):
#   picamera2, libcamera, pykms, pidng, piexif, simplejpeg, python-prctl, v4l2/videodev2, av
#   (the old venv had these COPIED into site-packages by hand; the new one just sees the apt ones)
# Dropped on purpose:
#   azure-iot-device 2.14.0  (Azure gone)      paho-mqtt 1.6.1 -> 2.1.0 (mqtt_publisher.py needs the v2 API)

